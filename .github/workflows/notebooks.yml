name: notebooks

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute every notebook
        run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/executed" notebooks/*.ipynb
